[project]
name = "cloudtrail-slack-integration-lambda-tests"
version = "0.0.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
  "pytest>=7.0",
  # boto3 should match the version used in the lambda runtime
  # https://docs.aws.amazon.com/lambda/latest/dg/lambda-python.html#python-sdk-included
  "boto3>=1.26",
]

# The tests live outside the Lambda asset directory: CDK hashes every file in that
# directory, so pytest caches and virtualenvs placed there would change the deployed
# asset hash.
[tool.pytest.ini_options]
pythonpath = ["../cloudtrail-slack-integration-lambda"]
